anyhow    = "1"
axum        = { version = "0.8", features = ["macros", "ws", "multipart"] }
axum-server = { version = "0.9", features = ["tls-rustls"] }
blake3  = "1"
bytemuck = { version = "1.25", features = ["derive"] }
ciborium   = "0.2"
clap = { version = "4", features = ["derive"] }
ed25519-dalek   = { version = "3", features = ["serde", "rand_core"] }
futures           = "0.3"
half     = { version = "2", features = ["serde"] }
image = "0.25"
matrixmultiply = "0.3"
memmap2 = "0.9"
metal   = "0.33"
ort          = { version = "=2.0.0-rc.11", default-features = false }
pollster = "1.0"
prost       = "0.14"
rayon       = "1"
rcgen   = "0.14"
reqwest = { version = "0.13", features = [
    "json", "query", "form", "cookies", "stream", "gzip", "blocking",
] }
rustfft     = "6.4"
rustls  = { version = "0.23", default-features = false, features = ["ring", "std"] }
rustls-pemfile  = "2"
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile  = "3"
thiserror = "2"
tokenizers              = { version = "0.23", default-features = false, features = ["onig"] }
tokio = { version = "1", features = [
    "rt-multi-thread", "macros", "sync", "io-util",
    "fs", "signal", "time", "net", "process",
] }
tokio-stream      = "0.1"
tonic-prost-build = "0.14"
tower       = { version = "0.5", features = ["full"] }
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
wasmtime        = "50"
# Held at 29 (2026-11-13): with wgpu 30, rce-vm-backend-wgpu's debug tests crash
# (SIGSEGV in libvulkan) in 8 of 30 runs on lavapipe when the Khronos validation
# layer is loaded; 0 of 25 on 29, 0 of 30 on 30 with the layer disabled.
wgpu     = "29.0"
regex = "1"
proptest = "1"

[workspace.lints.rust]
dead_code           = "allow"
unused_variables    = "allow"
unused_imports      = "allow"
unused_mut          = "allow"
private_interfaces  = "allow"
unused_must_use     = "allow"
unused_comparisons  = "allow"
unreachable_code    = "allow"

[workspace.lints.rust.unexpected_cfgs]
level = "warn"
check-cfg = ['cfg(target_feature, values("memory64"))', 'cfg(kani)']

[workspace.lints.clippy]
unwrap_used    = "warn"
expect_used    = "warn"
panic          = "warn"
todo           = "warn"
unimplemented  = "warn"
