[package]
name        = "rce-mamba1"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Pure Mamba-1 inference runtime on the rce substrate. Every block is a Mamba-1 SSM mixer with residual — no attention, no FFN. Targets the `mamba` GGUF arch (Falcon3-Mamba, original Mamba paper checkpoints). Reuses rce-op-ssm::selective_scan_mamba1_step (bit-correct vs llama.cpp post the `ssm_a` convention fix)."

[[bin]]
name = "mamba1-chat"
path = "src/bin/chat.rs"

[dependencies]
rce-ingest-gguf = { workspace = true }
rce-vm-backend-cpu = { workspace = true }
rce-op-ssm = { workspace = true }
rce-op-conv1d = { workspace = true }
rce-op-blas = { workspace = true }
rce-op-qmm = { workspace = true }
memmap2              = { workspace = true }
tracing              = { workspace = true }
