[package]
name        = "rce-wasm-kernels"
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The kernel library of `rce emit wasm`: the reference node step of rce-vm-backend-cpu compiled to WebAssembly"

[lib]
name = "rce_wasm_kernels"
crate-type = ["cdylib", "rlib"]

[dependencies]
rce-graph          = { workspace = true }
rce-vm-backend-cpu = { workspace = true }
serde              = { workspace = true }
serde_json         = { workspace = true }
blake3             = { workspace = true }
