[package]
name        = "rce-federation-http"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "HTTP/JSON transport for rce-federation — axum server + reqwest client. Workers expose their Federation state via GET /federation/state; peers gossip by fetching each other's state and joining the OR-Set Membership lattice + DigestRegistry. The smallest first stake; production deployments add TLS / mTLS / retries / health endpoints on top."

[dependencies]
rce-federation = { workspace = true }
axum             = { workspace = true }
reqwest          = { workspace = true }
serde            = { workspace = true }
serde_json       = { workspace = true }
tokio            = { workspace = true }
tower            = { workspace = true }
tracing          = { workspace = true }
thiserror        = { workspace = true }
# TLS: rustls server via axum-server, rustls client via reqwest. Both
# trust the platform store by default; self-signed certs (typically
# generated by `rcgen` for tests) are accepted via the client's
# `accept_invalid_certs` builder.
axum-server      = { workspace = true }
# mTLS support: build a `rustls::ServerConfig` with
# `WebPkiClientVerifier` to require client cert authentication.
rustls           = { workspace = true }
rustls-pemfile   = { workspace = true }

[dev-dependencies]
tokio = { workspace = true }
rcgen = { workspace = true }
