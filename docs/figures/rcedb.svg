   <g id="text_1">
    <text style="font-weight: 700; font-size: 16px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #1f2937" x="23.94" y="32.148" transform="rotate(-0 23.94 32.148)">RCEdb: the log is the database</text>
   </g>
   <g id="text_2">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #475569" x="23.94" y="54.324" transform="rotate(-0 23.94 54.324)">One primary artefact (D). Indexes are RCE code: deterministic folds over a prefix of D. Queries read indexes, with a defined order.</text>
   </g>
   <g id="text_3">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #1f2937" transform="translate(104.428906 152.569555)">Log D</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #1f2937" transform="translate(41.344531 164.572289)">append-only, SHA-256 chained</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #1f2937" transform="translate(62.73125 176.575023)">durable barrier per OS</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #1f2937" transform="translate(48.353125 188.577758)">verify on read, drop torn tail</text>
   </g>
   <g id="text_4">
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #1f2937" transform="translate(329.687266 105.144846)">index = fold(D prefix)</text>
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #1f2937" transform="translate(339.215469 116.547443)">by key (map fold)</text>
   </g>
   <g id="text_5">
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #1f2937" transform="translate(329.687266 160.584846)">index = fold(D prefix)</text>
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #1f2937" transform="translate(334.162656 171.987443)">by time (Tick order)</text>
   </g>
   <g id="text_6">
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #1f2937" transform="translate(329.687266 216.024846)">index = fold(D prefix)</text>
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #1f2937" transform="translate(340.742148 227.427443)">full text / custom</text>
   </g>
   <g id="text_7">
    <text style="font-weight: 700; font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: middle" x="381.06" y="76.5" transform="rotate(-0 381.06 76.5)">Indexes written in RCE (example 55)</text>
   </g>
   <g id="text_8">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #1f2937" transform="translate(596.112969 152.570336)">Queries</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #1f2937" transform="translate(575.923125 164.57307)">ordered results;</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #1f2937" transform="translate(578.8825 176.575805)">same D prefix,</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #1f2937" transform="translate(582.156719 188.577758)">same answer</text>
   </g>
   <g id="text_9">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1f2937" transform="translate(724.338984 154.110902)">digest</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1f2937" transform="translate(721.304297 164.91266)">per seq</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1f2937" transform="translate(720.838828 175.715121)">(rebuild</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1f2937" transform="translate(718.309687 186.517582)">&amp; check)</text>
   </g>
   <g id="text_10">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #475569" x="23.94" y="284.4" transform="rotate(-0 23.94 284.4)">Snapshots are caches: (seq, state_hash, bytes); a mismatch with D at seq discards the snapshot. Source: rce-host-survey RCEDB.md R1 to R6; spec 6.1, D.5, D.6.</text>
   </g>
