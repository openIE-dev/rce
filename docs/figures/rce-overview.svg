   <g id="text_1">
    <text style="font-weight: 700; font-size: 16px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #1f2937" x="23.94" y="32.148" transform="rotate(-0 23.94 32.148)">RCE at a glance</text>
   </g>
   <g id="text_2">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #475569" x="23.94" y="54.324" transform="rotate(-0 23.94 54.324)">One program, one meaning: a Form. The checker admits it, the log records every step, emitters project it, a host runs it.</text>
   </g>
   <g id="text_3">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #1f2937" transform="translate(62.339531 143.770844)">source.rce</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #1f2937" transform="translate(63.321797 156.972992)">(text, IDE,</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #1f2937" transform="translate(61.354687 170.176)">tree-sitter)</text>
   </g>
   <g id="text_4">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #1f2937" transform="translate(248.771563 137.16934)">rce checker</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #1f2937" transform="translate(212.990625 150.372348)">parse, types, ownership,</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #1f2937" transform="translate(210.781172 163.575355)">termination, rules named</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #1f2937" transform="translate(253.311641 176.778363)">on refusal</text>
   </g>
   <g id="text_5">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #1f2937" transform="translate(478.805156 117.365687)">Form</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #1f2937" transform="translate(445.140859 130.568695)">P = (S, E, δ, D, λ)</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #1f2937" transform="translate(492.66 143.770844)"/>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #1f2937" transform="translate(441.625156 156.972992)">S states   E events</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #1f2937" transform="translate(428.735391 170.175141)">δ step: (s, e) → (s', out)</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #1f2937" transform="translate(455.531562 183.378148)">D durable log</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #1f2937" transform="translate(439.943359 196.581156)">λ outputs → effects</text>
   </g>
