   <g id="text_1">
    <text style="font-weight: 700; font-size: 16px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #1f2937" x="23.94" y="32.148" transform="rotate(-0 23.94 32.148)">The RCE host contract (spec Appendix E)</text>
   </g>
   <g id="text_2">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #475569" x="23.94" y="54.324" transform="rotate(-0 23.94 54.324)">Five primitives every surveyed target supplies; everything else is an adapter whose result is logged.</text>
   </g>
   <g id="text_3">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #1f2937" transform="translate(54.49375 102.20268)">1  Pure compute on bytes</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #1f2937" transform="translate(49.255469 114.205414)">(integer ops, binary64 RNE)</text>
   </g>
   <g id="text_4">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #1f2937" x="118.8" y="166.416047" transform="rotate(-0 118.8 166.416047)">2  Append-only storage</text>
   </g>
   <g id="text_5">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #1f2937" x="118.8" y="224.628047" transform="rotate(-0 118.8 224.628047)">3  SHA-256 as pure code</text>
   </g>
   <g id="text_6">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #1f2937" transform="translate(68.966406 276.83907)">4  One input queue,</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #1f2937" transform="translate(74.160937 288.841023)">one output queue</text>
   </g>
   <g id="text_7">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #1f2937" transform="translate(65.685156 335.05068)">5  Monotonic counter</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #1f2937" transform="translate(50.816406 347.053414)">(read by the admitter only)</text>
   </g>
   <g id="text_8">
    <text style="font-weight: 700; font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: middle" x="118.8" y="70.956" transform="rotate(-0 118.8 70.956)">Primitives</text>
   </g>
   <g id="text_9">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #1f2937" x="319.68" y="104.046047" transform="rotate(-0 319.68 104.046047)">keyboard</text>
   </g>
   <g id="text_10">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #1f2937" x="319.68" y="149.506847" transform="rotate(-0 319.68 149.506847)">socket</text>
   </g>
   <g id="text_11">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #1f2937" x="319.68" y="194.967647" transform="rotate(-0 319.68 194.967647)">file</text>
   </g>
   <g id="text_12">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #1f2937" x="319.68" y="240.428447" transform="rotate(-0 319.68 240.428447)">clock</text>
   </g>
   <g id="text_13">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #1f2937" x="319.68" y="285.888856" transform="rotate(-0 319.68 285.888856)">GPU</text>
   </g>
   <g id="text_14">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #1f2937" x="319.68" y="331.350047" transform="rotate(-0 319.68 331.350047)">foreign lib</text>
   </g>
   <g id="text_15">
    <text style="font-weight: 700; font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: middle" x="319.68" y="70.956" transform="rotate(-0 319.68 70.956)">Adapters</text>
   </g>
   <g id="text_16">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #1f2937" transform="translate(470.84125 191.377945)">Admitter</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #1f2937" transform="translate(444.284219 203.38068)">(HC-1: exactly one)</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #1f2937" transform="translate(458.077969 215.383414)">orders inputs,</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #1f2937" transform="translate(459.175625 227.386148)">appends to D</text>
   </g>
   <g id="text_17">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #1f2937" transform="translate(644.986562 139.62468)">Program: δ and λ</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #1f2937" transform="translate(621.738906 151.627414)">sees only admitted events</text>
   </g>
   <g id="text_18">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #1f2937" transform="translate(628.936562 267.13668)">Log D (durable append,</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #1f2937" transform="translate(614.66625 279.139414)">hash chained, verify on read)</text>
   </g>
   <g id="text_19">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #334155" x="581.94" y="161.3232" transform="rotate(-0 581.94 161.3232)">events</text>
   </g>
   <g id="text_20">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #334155" x="581.94" y="238.9392" transform="rotate(-0 581.94 238.9392)">append</text>
   </g>
   <g id="text_21">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #334155" x="687.96" y="206.784" transform="rotate(-0 687.96 206.784)">λ requests → one result event (HC-3)</text>
   </g>
   <g id="text_22">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1f2937" transform="translate(454.594219 361.725012)">Replay (HC-8, T37): read D, disconnect every adapter, re-derive</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1f2937" transform="translate(436.299609 372.527473)">every state hash. No clock, file, network, device or environment is read.</text>
   </g>
  </g>
 </g>
