name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned Rust toolchain
        run: rustup show
      # crates/ide-sandbox tests build crates/rce-guest for WASI
      - name: Add the WASI target
        run: rustup target add wasm32-wasip1
      - name: Build
        run: cargo build --release --workspace
      - name: Tests
        run: cargo test --release --workspace --no-fail-fast
      - name: Clippy
        run: cargo clippy --release --workspace --all-targets -- -D warnings
      - name: Vendored checker matches its recorded source
        run: grep -q '^commit ' vendor/rce-spec/SOURCE
