[package]
name = "rce-spec-check-wasm"
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"
description = "rce-check compiled to wasm32 for the browser: the checker sources are included unchanged by #[path]; this crate adds only the wasm-bindgen surface."

[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = "=0.2.100"
sha2 = "0.11"
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
