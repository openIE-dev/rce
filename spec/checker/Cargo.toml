[package]
name = "rce-spec-check"
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"
license = "MIT OR Apache-2.0"
description = "Reference parser, type and well-formedness checker for RCE-SPEC.md"

[lib]
name = "rce_spec_check"
path = "src/lib.rs"

[dependencies]
# 0.26 or 0.27, so the crate can share one lock with other crates that
# link tree-sitter 0.26 (Cargo allows one `links` per dependency graph).
tree-sitter = { version = ">=0.26, <0.28", optional = true }
regex = "1"
serde_json = { version = "1", features = ["float_roundtrip", "unbounded_depth"] }
# AST terms of the Form (W2b): derive only
serde = { version = "1", features = ["derive"] }
sha2 = "0.11"
# heap-grown evaluator stack (interp::eval): deep but bounded recursion never
# depends on the thread stack the caller was given
stacker = "0.1"
# P3 (HC-4): foreign code as an isolated WebAssembly instance per call,
# under fuel, in a pure-Rust interpreter (no JIT, no host imports)
wasmi = "=1.1.0"
# P3 floats (HC-13): NaN canonicalization rewrites the module before it
# runs; the same wasmparser/wasm-encoder/wat versions wasmi's tree already uses
wasmparser = "=0.262.0"
wasm-encoder = { version = "=0.262.0", default-features = false, features = ["std", "wasmparser"] }
wat = "=1.262.0"
# TLS between hosts (P4): TLS 1.3, mutual, pinned Ed25519 keys, no CA; ring
# as the one crypto provider (no C toolchain beyond what ring needs)
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rcgen = { version = "0.13", default-features = false, features = ["ring", "crypto"] }
ring = "0.17"

[target.'cfg(unix)'.dependencies]
# PTY adapter (src/adapters.rs): openpty, poll, non-blocking read
libc = "0.2"

[build-dependencies]
cc = { version = "1", optional = true }

[features]
# Default: Rust parser + LALR(1) only, pure Rust (no C compiler).
# `tree-sitter` adds the C tree-sitter port as an independent second parser
# (used by rce-spec-check and rce-fuzz in CI).
default = []
tree-sitter = ["dep:tree-sitter", "dep:cc"]

[[bin]]
name = "rce"
path = "src/bin/rce.rs"

[[bin]]
name = "rce-check"
path = "src/main.rs"

[[bin]]
name = "rce-spec-check"
path = "src/bin/spec_check.rs"

[[bin]]
name = "rce-fuzz"
path = "src/bin/fuzz.rs"
required-features = ["tree-sitter"]

[[bin]]
name = "rce-spec-data"
path = "src/bin/spec_data.rs"

[[bin]]
name = "rce-conform"
path = "src/bin/conform.rs"

[[bin]]
name = "rce-conform-lean"
path = "src/bin/conform_lean.rs"

[[bin]]
name = "rce-book"
path = "src/bin/book.rs"

# Benchmark only (scripts/bench-determinism.py): times δ with and without
# the log D chain. It adds no command or flag to `rce`.
[[bin]]
name = "rce-bench-det"
path = "src/bin/bench_det.rs"

[profile.release]
debug = false


[[example]]
name = "run06"

# Standalone: the repo root workspace excludes crates/rce, but its manifest
# carries a [patch."openie"] that only parses where the openie registry is
# configured (a user cargo config). Without this table cargo walks up, parses
# the root and fails on CI ("failed searching for potential workspace").
[workspace]
