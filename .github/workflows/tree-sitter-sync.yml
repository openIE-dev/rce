name: tree-sitter sync

# The reference checker tests with the tree-sitter CLI installed, including
# tree_sitter_sync (the tree-sitter grammar against the Rust parser under
# the version rule of spec 2.7). CI=true makes that test fail instead of
# skipping when the CLI is missing.

on:
  push:
  pull_request:

# ci.yml runs the suite without the tree-sitter feature. This workflow
# runs tree_sitter_sync for each feature set, the fast tests with the
# tree-sitter feature on, and form_bridge, break_fg8_witness and emit_run
# with that feature. The other slow binaries do not use the feature.

jobs:
  checker:
    runs-on: ubuntu-latest
    # Sync and fuzz, then the fast suite with the tree-sitter feature.
    # form_bridge, break_fg8_witness and emit_run are the slow job
    # below, so they are not in that suite. No test is dropped.
    # 60 minutes remains the limit.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        features: ["", "tree-sitter"]
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned Rust toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: spec/checker
      - name: Install the tree-sitter CLI
        run: cargo install --locked tree-sitter-cli --version 0.27.1
      - name: tree_sitter_sync
        working-directory: spec/checker
        run: cargo test --release ${{ matrix.features != '' && format('--features {0}', matrix.features) || '' }} --test tree_sitter_sync
      - name: Grammar fuzz, fixed seed (checker no-panic, tree-sitter differential)
        working-directory: spec/checker
        timeout-minutes: 15
        run: cargo test --release ${{ matrix.features != '' && format('--features {0}', matrix.features) || '' }} --test grammar_fuzz
      - name: Fast tests with the feature set
        if: ${{ matrix.features == 'tree-sitter' }}
        env:
          RCE_FEATURES: ${{ matrix.features }}
        run: bash scripts/ci-tests.sh fast

  # The same three binaries, built with the tree-sitter feature. ci.yml
  # runs them without that feature. Each binary has its own job so the
  # feature suite above is not the sum of their times.
  slow:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        bin:
          - break_fg8_witness
          - emit_run
          - form_bridge
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned Rust toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: spec/checker
      - name: ${{ matrix.bin }} with the tree-sitter feature
        env:
          RCE_FEATURES: tree-sitter
        run: bash scripts/ci-tests.sh bin ${{ matrix.bin }}
