name: book

# The RCE Book (book/): every listing is checked with the reference checker
# built from this same commit, and the book is built with mdBook. The
# published book is assembled by pages.yml under /book/.

on:
  push:
  pull_request:

jobs:
  listings:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned Rust toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: spec/checker
      - name: Build rce
        working-directory: spec/checker
        run: cargo build --release --bin rce
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check every listing
        run: RCE="$PWD/spec/checker/target/release/rce" book/scripts/check-listings.sh

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install mdBook
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -sSL https://github.com/rust-lang/mdBook/releases/download/v0.4.52/mdbook-v0.4.52-x86_64-unknown-linux-gnu.tar.gz | tar -xz -C "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Build the book
        working-directory: book
        run: mdbook build
