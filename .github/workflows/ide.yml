name: ide

# ide/: the editor, MCP server and sandbox, built against the reference
# checker at spec/checker of this same commit (a path dependency).

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: ide
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned Rust toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ide
      # crates/ide-sandbox tests build crates/rce-guest for WASI;
      # the browser IDE (crates/rce-ide/src/web.rs) builds for wasm32-unknown-unknown
      - name: Add the WASI and browser targets
        run: rustup target add wasm32-wasip1 wasm32-unknown-unknown
      - name: Build
        run: cargo build --release --workspace
      - name: Tests
        run: cargo test --release --workspace --no-fail-fast
      - name: Clippy
        run: cargo clippy --release --workspace --all-targets -- -D warnings
      # web.rs is compiled only for wasm32, so the native steps above do not
      # build it; this is the library step of crates/rce-ide/web/build.sh
      - name: Clippy, browser build
        run: cargo clippy --release --target wasm32-unknown-unknown -p rce-ide --lib -- -D warnings
