name: ci

on:
  push:
  pull_request:

# The test suite is split so no single job runs for hours: the fast tests and
# each slow vector suite (scripts/ci-tests.sh lists them) are separate jobs,
# each with a timeout, each run with and without the version 0.6 suites.
jobs:
  spec:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: spec/checker
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned Rust toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: spec/checker
      - name: Build
        run: cargo build --release
      - name: Check the specification and examples
        run: cargo run --release --bin rce-spec-check
      - name: Check the book is in sync
        run: cargo run --release --bin rce-book -- build --check
      - name: Check the rce-form/1 fixtures are what their generator writes
        run: python3 ../../spec/examples/form/make.py --check
      - name: T7 on every corpus program (rce equiv against the name-free projection)
        run: bash ../../scripts/t7-equiv.sh
      - name: Clippy
        run: cargo clippy --release --all-targets

  tests-fast:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        features: [""]
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned Rust toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: spec/checker
      # tree_sitter_sync needs the tree-sitter CLI; it runs in the
      # tree-sitter-sync workflow
      - name: Fast tests
        env:
          RCE_FEATURES: ${{ matrix.features }}
        run: bash scripts/ci-tests.sh fast

  tests-slow:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        features: [""]
        bin:
          - dst_chat
          - emit
          - framing_rce
          - fuel
          - golden_apps
          - group_rce
          - hpke_rce
          - mls_rce
          - pq_rce
          - protect_rce
          - treekem_rce
          - welcome_rce
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned Rust toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: spec/checker
      # the emit tests run the Scala target with scala-cli (Scala 3.10.0, JVM 21)
      - if: matrix.bin == 'emit'
        uses: VirtusLab/scala-cli-setup@v1
        with:
          jvm: temurin:21
      - name: Slow test binary ${{ matrix.bin }}
        env:
          RCE_FEATURES: ${{ matrix.features }}
        run: bash scripts/ci-tests.sh bin ${{ matrix.bin }}

  tree-sitter:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: spec/checker
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - name: Install the tree-sitter CLI
        run: cargo install tree-sitter-cli --version 0.27.1 --locked
      - name: Three-parser check
        run: cargo run --release --features tree-sitter --bin rce-spec-check

  wasm-checker:
    # the playground checker (spec/checker-wasm) includes the checker's modules by path;
    # a module added to the checker must be added there too, or this job fails
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: spec/checker-wasm
    steps:
      - uses: actions/checkout@v4
      - run: rustup show && rustup target add wasm32-unknown-unknown
      - run: cargo check --target wasm32-unknown-unknown
