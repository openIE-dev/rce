name: lean

# spec/lean: build the proof library with the pinned toolchain and run the
# standing axiom audit (every RCE theorem uses only propext, Quot.sound and
# Classical.choice; a sorry fails the check).

on:
  push:
    paths:
      - 'spec/lean/**'
      - 'scripts/lean-audit.sh'
      - '.github/workflows/lean.yml'
  pull_request:
    paths:
      - 'spec/lean/**'
      - 'scripts/lean-audit.sh'
      - '.github/workflows/lean.yml'
  workflow_dispatch:

jobs:
  proofs:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Build spec/lean with the toolchain of lean-toolchain
        uses: leanprover/lean-action@v1
        with:
          lake-package-directory: spec/lean
          build: true
          test: false
          use-github-cache: true
      - name: Axiom audit
        working-directory: spec/lean
        run: |
          out=$(lake env lean audit/Audit.lean 2>&1); echo "$out"
          grep -q "standard axioms only" <<< "$out"
