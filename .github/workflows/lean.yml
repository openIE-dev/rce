name: lean

# spec/lean: build the proof library with the pinned toolchain and run the
# standing axiom and 6-kernel paranoid audit (every RCE theorem uses only
# propext, Quot.sound and Classical.choice; a sorry fails the check).

on:
  push:
    paths:
      - 'spec/lean/**'
      - 'scripts/lean-audit.sh'
      - '.github/workflows/lean.yml'
  pull_request:
    paths:
      - 'spec/lean/**'
      - 'scripts/lean-audit.sh'
      - '.github/workflows/lean.yml'
  workflow_dispatch:

jobs:
  proofs:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Build spec/lean with the toolchain of lean-toolchain
        uses: leanprover/lean-action@v1
        with:
          lake-package-directory: spec/lean
          build: true
          test: false
          use-github-cache: true
      - name: Enable bwrap sandbox on runner
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - name: Axiom and 6-kernel paranoid audit
        run: bash scripts/lean-audit.sh
