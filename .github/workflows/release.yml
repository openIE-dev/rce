name: release

# Builds the four release archives and publishes them as a GitHub release
# when a tag vX.Y.Z is pushed. Linux builds link against glibc 2.28 (zig);
# the Windows build is cross-built with MinGW; the macOS build is native
# (ad-hoc signed by the linker, not notarized).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-latest, how: zig, glibc: ".2.28" }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-latest, how: zig, glibc: ".2.28" }
          - { target: x86_64-pc-windows-gnu, os: ubuntu-latest, how: mingw, glibc: "" }
          - { target: aarch64-apple-darwin, os: macos-14, how: native, glibc: "" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: rustup show && rustup target add ${{ matrix.target }}
      - name: Install zig and cargo-zigbuild
        if: matrix.how == 'zig'
        run: |
          pip install ziglang
          cargo install --locked cargo-zigbuild
      - name: Install MinGW
        if: matrix.how == 'mingw'
        run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-x86-64
      - name: Build
        shell: bash
        run: |
          B="--release --target ${{ matrix.target }} -p rce-ide -p rce-mcp"
          case "${{ matrix.how }}" in
            zig) cargo zigbuild $B --target ${{ matrix.target }}${{ matrix.glibc }} ;;
            *) cargo build $B ;;
          esac
      - name: Smoke test
        if: matrix.how != 'mingw' && matrix.target != 'aarch64-unknown-linux-gnu'
        shell: bash
        run: |
          R=target/${{ matrix.target }}/release/rce
          $R --version
          printf 'fn main()\n    emit "hello, world"\n' > /tmp/hello.rce
          $R run /tmp/hello.rce
      - uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/rce
            target/${{ matrix.target }}/release/rce-ide
            target/${{ matrix.target }}/release/rce-lsp
            target/${{ matrix.target }}/release/rce-mcp
            target/${{ matrix.target }}/release/*.exe
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Package
        run: |
          for d in artifacts/bin-*; do
            T=${d#artifacts/bin-}
            mkdir -p target/$T/release
            cp $d/* target/$T/release/
            chmod +x target/$T/release/* || true
          done
          sh release/package.sh
      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/dist/* --title "RCE IDE ${GITHUB_REF_NAME#v}" --notes-file release/RELEASE.md
