name: conformance

# conformance/: static validation of the suite (format, ids, clause
# references, coverage) on three platforms, then the reference run against
# rce-conform built from this same commit, and the Scala emitter run (scala-cli,
# Scala 3.10.0 on JVM 21). Other emitter and engine-profile runs are recorded
# in conformance/README.md.

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - working-directory: conformance
        run: python tools/validate.py

  reference:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned Rust toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: spec/checker
      - name: Build rce and rce-conform
        working-directory: spec/checker
        run: cargo build --release --bin rce --bin rce-conform
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run the suite against the reference checker
        working-directory: conformance
        # RCE_ENGINE (the handler-spec profile, appendix D) is not set: the engine is not public, so those tests report unsupported.
        run: RCE="$GITHUB_WORKSPACE/spec/checker/target/release/rce" RCE_CONFORM="$GITHUB_WORKSPACE/spec/checker/target/release/rce-conform" python harness/run.py adapters/reference.json

  emit-scala:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned Rust toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: spec/checker
      - name: Build rce
        working-directory: spec/checker
        run: cargo build --release --bin rce
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: VirtusLab/scala-cli-setup@v1
        with:
          jvm: temurin:21
      - name: Fetch Scala 3.10.0 once, before the parallel run
        run: |
          scala-cli --version
          printf '@main def hello(): Unit = println("ok")\n' > "$RUNNER_TEMP/hello.scala"
          scala-cli run --jvm 21 --scala 3.10.0 -q "$RUNNER_TEMP/hello.scala"
      - name: Run the suite against the Scala emitter
        working-directory: conformance
        # a call waits up to 600 s (the harness default is 120 s): a program
        # compiles on scala-cli's compile server, which can stall, and the
        # adapter then runs it again without the server (RCE_SCALA_TRY, 150 s
        # a try); a program that hangs still fails
        env:
          RCE_TEST_TIMEOUT: "600"
        run: RCE="$GITHUB_WORKSPACE/spec/checker/target/release/rce" python harness/run.py jobs 4 adapters/emit-scala.json tests "$RUNNER_TEMP/results-emit-scala.json"
