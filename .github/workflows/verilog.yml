name: verilog

# The Verilog target (spec 10.5, spec/proposals/emit-verilog.md): every
# program of tests/emit_verilog.rs is printed by `rce emit verilog`,
# simulated on its examples by Icarus Verilog and by Verilator through the
# test bench spec/checker/hdl/rce_tb.v, and the trace that
# spec/checker/hdl/bench.py computes from the register dumps must equal the
# reference evaluator's line for line; then Yosys synthesizes each module
# and prints its cell counts. The tools come from the runner's package
# manager, and their versions are printed. A passing run is a simulation
# and synthesis result: no board ran the modules and no energy was measured.

on:
  push:
  pull_request:

jobs:
  verilog:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: spec/checker
    steps:
      - uses: actions/checkout@v4
      - name: Install Icarus Verilog, Verilator and Yosys
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog verilator yosys
      - name: Tool versions
        run: |
          dpkg-query -W iverilog verilator yosys
          iverilog -V 2>&1 | head -n 1 || true
          verilator --version
          yosys -V
      - name: Install the pinned Rust toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: spec/checker
      - name: Build
        run: cargo build --release --bin rce
      - name: Emission, admission, golden modules and the harness
        run: cargo test --release --test emit_verilog
      - name: Icarus Verilog, Verilator and Yosys on every program
        run: cargo test --release --test emit_verilog -- --include-ignored --nocapture --test-threads 1
