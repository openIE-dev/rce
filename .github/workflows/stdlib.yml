name: stdlib

# stdlib/: each library's checks against the reference checker built from
# this same commit; the slow vector sets run nightly.

on:
  push:
  pull_request:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

jobs:
  checks:
    # the libraries are split over parallel jobs (scripts/check.sh ONLY=...):
    # one run of everything exceeded the 60-minute job limit on a runner
    strategy:
      fail-fast: false
      matrix:
        group:
          - "crypto col core"
          - "data effect enc energy"
          - "fmt hash id io math"
          - "net num obs"
          - "os"
          - "rand text time ui"
    name: checks (${{ matrix.group }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned Rust toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: spec/checker
      - name: Build rce
        working-directory: spec/checker
        run: cargo build --release --bin rce
      - name: Run each library's checks
        working-directory: stdlib
        run: ONLY="${{ matrix.group }}" RCE="$GITHUB_WORKSPACE/spec/checker/target/release/rce" scripts/check.sh
      - name: Run the slow vector sets (nightly and on request)
        if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && matrix.group == 'crypto col core'
        working-directory: stdlib
        run: RCE="$GITHUB_WORKSPACE/spec/checker/target/release/rce" scripts/nightly.sh
