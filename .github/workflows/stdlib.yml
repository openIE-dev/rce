name: stdlib

# stdlib/: each library's checks against the reference checker built from
# this same commit; the slow vector sets run nightly.

on:
  push:
  pull_request:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned Rust toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: spec/checker
      - name: Build rce
        working-directory: spec/checker
        run: cargo build --release --bin rce
      - name: Run each library's checks
        working-directory: stdlib
        run: RCE="$GITHUB_WORKSPACE/spec/checker/target/release/rce" scripts/check.sh
      - name: Run the slow vector sets (nightly and on request)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        working-directory: stdlib
        run: RCE="$GITHUB_WORKSPACE/spec/checker/target/release/rce" scripts/nightly.sh
