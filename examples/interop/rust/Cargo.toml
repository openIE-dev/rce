[package]
name = "rce-interop"
version = "0.1.0"
edition = "2024"
publish = false

# A tokio service around programs printed by `rce emit rust`: check.py
# writes them into src/gen/ before it builds (src/gen/ is not committed).
[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync"] }
serde_json = "1"

[workspace]
