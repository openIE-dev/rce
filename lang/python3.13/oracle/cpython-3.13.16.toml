# The pinned oracle for the language python3.13: CPython 3.13.16 on x86-64
# Linux (spec/proposals/rce-form.md section 20, rce-oracle/1).
format   = "rce-oracle/1"
name     = "cpython-3.13.16"
kind     = "maintained"
lang     = "python3.13"
target   = "x86_64-unknown-linux-gnu"
lineage  = "cpython"
profile  = "command"                  # observe.toml: status, stdout bytes, stderr class
version  = ["/usr/bin/python3.13", "-VV"]
# {src} is the program's file in a new, empty run directory. -P keeps the
# program's directory off sys.path, -s keeps the user's site directory off
# it, and -S keeps the interpreter from importing the module site at
# startup. Without -S, site would put the system site directories on
# sys.path, run the .pth files there (on this host one imports
# _distutils_hack and installs an import hook) and import sitecustomize, a
# link to a file outside the pinned tree: code that [toolchain] does not
# pin would run before every program. With -S, sys.path holds the pinned
# tree, its lib-dynload and /usr/lib/python313.zip, which `absent` below
# pins as missing, so what runs before a program is the interpreter, its
# frozen modules and the pinned standard library. -S also leaves out the
# names site adds to the builtins for an interactive session (exit, quit,
# help, copyright, credits, license); no program of the corpus names them,
# and under this record a program that calls one ends with a NameError.
# Nothing else that the corpus programs mean changes; sys.exit is
# unaffected. The proposal's example uses -I, which also implies -E, and -E
# would make the interpreter ignore PYTHONHASHSEED below; here the
# environment is replaced whole instead, so no other PYTHON variable
# reaches a run.
source_name = "main.py"
build    = []
run      = ["/usr/bin/python3.13", "-P", "-s", "-S", "{src}"]
device   = "octets"
limit    = 10                         # seconds per run
runs     = 2                          # every case twice; the two observations must be equal

[toolchain]
# What stands for the OCI image digest of the proposal until an image is
# built: the SHA-256 of the interpreter, of every file of its standard
# library, and of the shared objects that the interpreter loads and that
# its extension modules (the files of `extension_dirs`) load when a
# program imports one, such as libcrypto for _hashlib. The digest leaves
# out the bytecode caches, which no run reads (PYTHONPYCACHEPREFIX below),
# and the site directories, which no run puts on sys.path (-S above). It
# pins each symbolic link by the path it points to; the two that point
# outside the tree, sitecustomize.py and the libpython of
# config-3.13-x86_64-linux-gnu/, are read by no run (-S; the interpreter
# is linked without libpython.so, as `libraries` shows). Not pinned: the
# files a shared object opens itself as it runs (OpenSSL's configuration,
# terminal descriptions). Of the extension modules, the corpus programs
# load only _decimal, which opens none.
executable  = "/usr/bin/python3.13"
sha256      = "a35753ccb97941cce1467786cce892e608141f09d717188a3235d4f51a754446"
tree        = "/usr/lib/python3.13"
tree_skip   = ["__pycache__", "site-packages", "dist-packages"]
tree_sha256 = "62921d7f66339b6260cb1f84c5858fb2e5601b45a3d69430c540c3045c878aa4"
absent      = ["/usr/lib/python313.zip"]   # on sys.path ahead of the tree; it must not exist
extension_dirs = ["lib-dynload"]
version_output = "Python 3.13.16 (main, Oct  1 2026, 15:40:24) [GCC 13.3.0]"

