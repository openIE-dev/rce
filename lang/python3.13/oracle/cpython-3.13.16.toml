[pins]
# The whole environment of each run: nothing else is passed. The hash seed is
# pinned, so it is an input of every case on both sides. The bytecode cache
# prefix names a directory in the run directory that never exists, so the
# interpreter reads no .pyc file from the __pycache__ directories of the
# tree, which its digest leaves out, and compiles each module it imports
# from its pinned source; PYTHONDONTWRITEBYTECODE keeps it from writing one.
env       = { LC_ALL = "C.UTF-8", TZ = "UTC", PYTHONHASHSEED = "0", PYTHONDONTWRITEBYTECODE = "1", PYTHONPYCACHEPREFIX = "{run}/no-bytecode-cache" }
network   = "none"                    # every run in a new network namespace with no interface up (unshare --net)
fs        = "run-directory"           # every run in a new, empty directory that holds only the program
# No wall clock is pinned: this host cannot set the clock of one process, so
# the clock is neither pinned nor perturbed, and [[unpinned]] keeps out a
# program that reads it.

[perturb]                             # each entry is one more run when a program is admitted
env_order = "reversed"                # the environment passed in reverse order
affinity  = [1, 4]                    # the run limited to the first 1, then 4, processors (taskset)
# Another hash seed: a program whose output follows the order of a set or of
# a dictionary built by hashing text would depend on the seed. Such a
# program enters only as a case whose own env names the seed.
env       = [{ PYTHONHASHSEED = "1" }, { PYTHONHASHSEED = "4242" }]

# What this host does not pin. A program whose text matches one of these
# patterns (Python regular expressions, multiline) is not admitted, with the
# source named, because its observation would not be a function of its case.
[[unpinned]]
source  = "clock"
pattern = '^\s*(?:import|from)\s+(?:time|datetime|timeit|asyncio|sched)\b'

[[unpinned]]
source  = "entropy"
pattern = '^\s*(?:import|from)\s+(?:random|secrets|uuid)\b|\burandom\b'

[[unpinned]]
source  = "filesystem"
pattern = '\bopen\s*\(|^\s*(?:import|from)\s+(?:os|pathlib|shutil|glob|tempfile|io|fileinput|sqlite3)\b'

[[unpinned]]
source  = "process"
pattern = '^\s*(?:import|from)\s+(?:subprocess|multiprocessing|threading|signal|platform|socket|resource|gc)\b|\bid\s*\('
